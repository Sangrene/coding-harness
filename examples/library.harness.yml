# Illustrative — not reverse-engineered from a real repo.
# A small Rust library: a keyed token-bucket rate limiter. Shows the scaled
# hexagon. The public API is the driving port; there is no driving adapter
# (the consumer's code calls in) and no composition root (the consumer builds
# the limiter and injects the clock and store). Scaling removes roles; it does
# not relax the dependency rule for the ones that remain.
harness_version: 2

project:
  name: bucketeer
  kind: library
  stack: rust
  language: "Rust 2021 edition"
  frameworks: ["thiserror"]
  summary: Keyed token-bucket rate limiter with pluggable clock and state store; optional Redis store behind a feature.

commands:
  run: cargo
  exec: ""
  add_dependency: "cargo add <dep>"
  gate:
    - "cargo check --all-targets --all-features"
  gate_name: compile-guard
  test_targeted: "cargo test --all-features {filter}"
  test_target_hint: "{filter} = a test path substring, e.g. bucket::tests::refills_after_interval"
  test_all: "cargo test --all-features"
  lint: "cargo clippy --all-targets --all-features -- -D warnings"
  arch_test: "cargo test --test architecture"
  hygiene:
    - "Never append 2>&1 — it swallows output and makes debugging impossible."
    - "Every public item has a doc comment; `cargo doc` is part of the release check."
    - "A change to a pub signature is a semver decision — say so in the receipt."

architecture:
  shape: library
  dependency_rule: "src/bucket.rs depends on nothing; src/limiter.rs depends on bucket and the ports in src/ports.rs; src/adapters/** implements ports and is never imported by bucket or limiter."
  hexagon:
    domain_type:      { name: Bucket (pure refill/take arithmetic), path: "src/bucket.rs" }
    domain_error:     { name: "LimitError (#[non_exhaustive])",    path: "src/error.rs" }
    driving_port:     { name: "public API: RateLimiter::check",     path: "src/limiter.rs, re-exported from src/lib.rs" }
    driving_adapter:  { absent: by-shape }
    driven_port:      { name: "Clock, BucketStore traits",          path: "src/ports.rs" }
    driven_adapter:   { name: "SystemClock, MemoryStore, RedisStore (feature = \"redis\")", path: "src/adapters/**" }
    # MemoryStore is a shipped driven adapter consumers select; only ManualClock is a double.
    test_double:      { name: "ManualClock",                        path: "src/adapters/manual_clock.rs (feature = \"test-util\")" }
    composition_root: { absent: by-shape }
  exemplar_slice: "src/bucket.rs + src/limiter.rs + src/adapters/memory_store.rs"
  leakage_examples: ["redis::RedisError", "redis::Value", "std::time::SystemTime (use the Clock port)", "tokio types in the sync API"]

  errors:
    type: "Result<T, LimitError>"
    never_throw: true            # no panic, unwrap or expect in non-test code
    discriminate_by: "enum variant"
    classification:
      - { source: "redis::RedisError", becomes: "LimitError::Store(source)", where: "src/adapters/redis_store.rs" }
      - { source: "capacity 0 / refill interval 0 at construction", becomes: "LimitError::InvalidConfig", where: "src/bucket.rs" }
      - { source: "bucket empty", becomes: "Ok(Decision::Deny { retry_after }) — not an error", where: "src/limiter.rs" }
    traps:
      - "turning a deny into Err makes callers treat back-pressure as failure"
      - "`Box<dyn Error>` without Send + Sync breaks async consumers"
      - "adding a LimitError variant without #[non_exhaustive] is a breaking change"

  validation:
    library: none
    placement: "Bucket::new and RateLimiter::builder().build() validate config and return Result; nothing else validates"

  type_escape_hatches: ["unwrap()", "expect()", "panic!", "unsafe", "as (lossy numeric casts — use try_from)"]
  modules: { enabled: false }

conformance:
  level: conforming
  gaps: []

layers:
  - agent: domain-builder
    kind: domain
    role: bucket arithmetic and the error type
    owns:
      - "src/bucket.rs"
      - "src/error.rs"
    rules:
      - "No std::time::SystemTime, no I/O, no async. Time comes in as a Duration since an epoch the caller chose."
      - "Saturating arithmetic only; overflow is a test case."
    reference: "src/bucket.rs"
    owns_tests: true             # #[cfg(test)] mod tests at the bottom of each file
    depends_on: []
    parallel_with: []
    optional: false
    skills: []

  - agent: api-builder
    kind: application
    role: the public API — limiter, builder, port traits, re-exports, integration tests
    owns:
      - "src/limiter.rs"
      - "src/ports.rs"
      - "src/lib.rs"
      - "tests/**"
    excludes:
      - "tests/architecture.rs"   # boundary test; generated by harness-init
    rules:
      - "Every pub item is documented and has a doctest or an integration test."
      - "Port traits name capabilities (Clock, BucketStore), take &self, and return Result<_, LimitError>."
      - "No adapter is constructed inside the library; the consumer passes them to the builder."
      - "lib.rs keeps `#![cfg_attr(not(test), deny(clippy::unwrap_used, clippy::expect_used))]` — the lint enforces the no-panic rule, not a grep."
    reference: "src/limiter.rs"
    owns_tests: true
    depends_on: [domain-builder]
    parallel_with: []
    optional: false
    skills: []

  - agent: adapter-builder
    kind: driven-adapter
    role: shipped port implementations, behind features where they pull dependencies
    owns: ["src/adapters/**"]
    rules:
      - "Each adapter that needs a crate sits behind a cargo feature; default features stay dependency-free."
      - "Classify backend errors into LimitError::Store; never expose redis types."
    owns_tests: true
    depends_on: [api-builder]
    parallel_with: []
    optional: true
    skills: []

plan:
  depth: single
  scout_name: feature-scout
  impact_scout: false
  spec: { enabled: false }

verify:
  layer_reviewer_checklist:
    - "No pub signature exposes an adapter's dependency type."
    - "bucket.rs and limiter.rs never name a concrete adapter."
    - "Any pub signature change is called out as a semver decision."
  mechanical_checks:
    - description: "no wall clock or adapter in the core"
      command: "grep -nE 'SystemTime|Instant::now|crate::adapters' src/bucket.rs src/limiter.rs"
      scope: repo
      expect: empty
  arch_tests:
    status: generate
    tool: "deny test (tests/architecture.rs scanning src/ for forbidden paths)"
    path: "tests/architecture.rs"
    rules:
      - "src/bucket.rs and src/error.rs reference no other crate module"
      - "src/limiter.rs and src/ports.rs never reference crate::adapters"
      - "default features pull no dependency besides thiserror (cargo metadata check)"

testing:
  placement: colocated
  path_formula: "#[cfg(test)] mod tests at the bottom of src/<file>.rs; public-API tests in tests/<behaviour>.rs"
  runners:
    - { name: cargo test, covers: [domain-builder, api-builder, adapter-builder] }
  doubles:
    style: hand-written-fakes
    location: "src/adapters/manual_clock.rs"   # compiled only under cfg(test) / feature test-util
    rule: "Tests drive time with ManualClock (the double) and may run against the shipped MemoryStore adapter; no mocking crate."
    typed_as_port: true          # let clock: Arc<dyn Clock> = Arc::new(ManualClock::new());
  spy_technique: "a test-local struct implementing BucketStore that records keys in a RefCell<Vec<_>> and delegates to MemoryStore"
  red_stub: "declare the fn with its final signature and body `todo!()` — it compiles, the test fails at runtime"
  tested_layers: [domain-builder, api-builder, adapter-builder]
  naming: technical

skills:
  invariant: [hexagonal-architecture, tdd, separation-of-concerns, extract-til-you-drop, orchestrator]
  filled: [architecture, testing, error-handling]
  optional:
    i18n: { enabled: false }
    component_design: { enabled: false }
    presentation_model: false
    modules: false
    spec_implement: false

emit:
  cursor_compat: false
  agent_suffix: ".md"
  memory_file: "CLAUDE.md"
  standing_authorization: true
  runner_model: ""
  hooks:
    receipt_check: false
