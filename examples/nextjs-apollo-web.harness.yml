# Modelled on a real Next.js/Apollo codebase — a second web-app instance, same
# shape as react-router-web.harness.yml with a different stack. Kept to show which
# fields actually move between two repos of the same kind.
#
# Differences from the repo's own harness, deliberate:
#   - a `domain-builder` layer is split out of repository-builder. v2 requires
#     exactly one domain layer; today the model type is written by the agent
#     that also writes the Apollo adapter.
#   - agent files use the `.agent.md` suffix, as the repo already does.
harness_version: 2

project:
  name: acme-console
  kind: web-app
  stack: typescript
  language: "TypeScript 7"
  frameworks: ["Next.js 16", "React 19", "Apollo Client", "Zustand", "react-hook-form", "Jest"]
  summary: Next.js app migrating legacy services to hexagonal slices — Apollo repositories, Zustand stores, neverthrow, Jest.

commands:
  run: yarn
  exec: yarn dlx
  add_dependency: yarn add
  gate:
    - "yarn typecheck"
  gate_name: typecheck-guard
  test_targeted: "yarn jest --no-coverage --watchAll=false {path}"
  test_target_hint: "{path} = the test file(s) touched this round, e.g. src/order/features/create-order/create-order.use-case.test.ts"
  test_all: "yarn jest --no-coverage --watchAll=false"
  lint: "yarn lint"
  arch_test: ""
  hygiene:
    - "Always yarn. Never npm or npx."
    - "Never append 2>&1 — it swallows output and makes debugging impossible."
    - "Targeted jest needs --no-coverage --watchAll=false or it enters watch mode."
    - "Test runs can exceed a minute — always wait for exit."

# AGENTS.md is regenerated by `next dev`; quote it, don't move it.
carry_forward:
  - "This is NOT the Next.js you know. Read the relevant guide in node_modules/next/dist/docs/ before writing any code. Heed deprecation notices."
  - "Components must not own react-hook-form lifecycle or orchestration: useForm, defaults, submit/reset and dirty-state sync live in the view-model hook."

architecture:
  shape: full
  dependency_rule: "Use cases depend on repository interfaces and store types only — never on React, Apollo, or Next.js."
  hexagon:
    domain_type:      { name: model type,             path: "src/<domain>/features/shared/<domain>.model.type.ts" }
    domain_error:     { name: "<Domain>DomainError union (type field)", path: "src/<domain>/features/shared/<domain>.model.type.ts" }
    driving_port:     { name: use case,               path: "src/<domain>/features/<feature>/<feature>.use-case.ts" }
    driving_adapter:  { name: component,              path: "src/components/<domain>/<FeatureName>/<FeatureName>.tsx" }
    driven_port:      { name: repository interface,   path: "src/<domain>/features/shared/<domain>.repository.interface.ts" }
    driven_adapter:   { name: Apollo repository,      path: "src/<domain>/features/shared/infrastructure/<domain>.repository.apollo.ts" }
    test_double:      { name: repository fake,        path: "src/<domain>/features/shared/test/<domain>.repository*.ts" }
    composition_root: { name: StoreProvider + use<Domain>Repository, path: "src/shared/StoreProvider.tsx, src/<domain>/features/shared/infrastructure/use<Domain>Repository.ts" }
  exemplar_slice: "src/order/"
  leakage_examples: ["__typename", "generated GraphQL operation types", "ApolloError", "gql fragments"]

  errors:
    type: "ResultAsync<T, <Domain>DomainError> (neverthrow)"
    never_throw: true
    discriminate_by: "type field (VALIDATION_ERROR | NOT_FOUND | NETWORK_ERROR)"
    classification:
      - { source: "Apollo / network failure", becomes: "NETWORK_ERROR (backend code kept in `code`)", where: "src/<domain>/features/shared/infrastructure/<domain>.repository.apollo.ts" }
      - { source: "entity missing in response", becomes: "NOT_FOUND", where: "src/<domain>/features/shared/infrastructure/<domain>.repository.apollo.ts" }
      - { source: "command fails a business check", becomes: "VALIDATION_ERROR", where: "src/<domain>/features/<feature>/<feature>.use-case.ts" }
    traps:
      - "`.map(() => ok())` nests a Result"
      - "`ResultAsync.fromPromise` without a mapper leaves the error `unknown`"
      - "`.match(() => undefined, () => undefined)` swallows both branches"

  validation:
    library: none
    placement: "use case checks the command and returns VALIDATION_ERROR before calling the repository; react-hook-form handles field-level input in the view-model"

  type_escape_hatches: ["as", "any", "!", "@ts-ignore"]
  modules: { enabled: false }

conformance:
  level: partial
  gaps:
    - role_or_rule: legacy services
      finding: "Pre-migration features still use src/services/<Domain>Service with logic in components; the hexagon exists only in migrated domains."
      paths: ["src/services/**", "src/models/**"]
      disposition: migrate
      layers: [repository-builder, use-case-builder, component-builder]
    - role_or_rule: dependency_rule
      finding: >
        Use cases import the Zustand store type from infrastructure/<domain>.store.ts
        and read it to decide (create-order checks reference uniqueness against
        orderStore.getState()). The state contract is owned by infrastructure
        and the cache is the source of truth for a rule.
      paths: ["src/<domain>/features/*/*.use-case.ts", "src/<domain>/features/shared/infrastructure/*.store.ts"]
      disposition: migrate
      layers: [use-case-builder, store-builder]
    - role_or_rule: domain_type
      finding: "Anemic domain: rules (required fields, uniqueness) live in use-case bodies and produce translated strings, not domain error data."
      paths: ["src/<domain>/features/*/*.use-case.ts"]
      disposition: migrate
      layers: [use-case-builder]
    - role_or_rule: translation boundary
      finding: "Apollo mappers take `raw: any`, so the wire shape is unchecked at the boundary."
      paths: ["src/<domain>/features/shared/infrastructure/*.repository.apollo.ts"]
      disposition: enforce-now
      layers: [repository-builder]

layers:
  - agent: domain-builder
    kind: domain
    role: model types, domain error union, pure helpers
    # model.type.ts, utils, and the pure helpers beside them (order.totals.ts,
    # invoice.line-items.ts), with their tests.
    owns: ["src/<domain>/features/shared/*.ts"]
    excludes: ["src/<domain>/features/shared/<domain>.repository.interface.ts"]
    rules:
      - "No React, Apollo, Zustand or i18n import."
      - "Error unions discriminate on `type`; add variants, never a free-form message catch-all."
    reference: "src/order/features/shared/order.model.type.ts"
    owns_tests: true
    depends_on: []
    parallel_with: []
    optional: false
    skills: []

  - agent: repository-builder
    kind: driven-adapter
    role: repository interface, Apollo adapter, injection hook, fakes
    owns:
      - "src/<domain>/features/shared/<domain>.repository.interface.ts"
      - "src/<domain>/features/shared/infrastructure/<domain>.repository.apollo.ts"
      - "src/<domain>/features/shared/infrastructure/use<Domain>Repository.ts"
      - "src/<domain>/features/shared/test/*.ts"
    rules:
      - "No GraphQL/Apollo type or __typename escapes the adapter."
      - "Fakes `implements <Domain>RepositoryInterface`; error-fake and loading-fake variants sit beside the plain fake."
    reference: "src/order/features/shared/infrastructure/order.repository.apollo.ts"
    owns_tests: false
    depends_on: [domain-builder]
    parallel_with: [store-builder]
    optional: false
    skills: []

  - agent: store-builder
    kind: state
    role: Zustand store and its registration
    owns:
      - "src/<domain>/features/shared/infrastructure/*.store.ts"
      - "src/<domain>/features/shared/infrastructure/*.store.test.ts"
      - "src/shared/StoreContext.ts"
      - "src/shared/StoreProvider.tsx"
    owns_tests: false
    depends_on: [domain-builder]
    parallel_with: [repository-builder]
    optional: true
    skills: []

  - agent: use-case-builder
    kind: application
    role: command/query type, use-case factory, use-case tests
    # command/query, use case, its test, and feature-local helpers (price-rounding.ts).
    owns: ["src/<domain>/features/<feature>/*.ts"]
    excludes:
      - "src/<domain>/features/shared/**"            # <feature> also matches shared/
      - "src/<domain>/features/<feature>/*.view-model.ts"
    rules:
      - "Factory receiving one deps object of interfaces."
      - "Zero React, Apollo or Next.js imports."
      - "Validation errors update the store before returning errAsync."
      - "Any use case calling notificationService must also declare translationService; all user-facing strings go through t(key, { ns })."
    reference: "src/order/features/approve-order/approve-order.use-case.ts"
    owns_tests: true
    depends_on: [repository-builder]
    parallel_with: [store-builder]
    optional: false
    skills: []

  - agent: view-model-builder
    kind: presentation
    role: view-model hook and its tests
    owns:
      - "src/components/**/*.view-model.ts"
      - "src/components/**/*.view-model.test.tsx"
      - "src/<domain>/features/<feature>/*.view-model.ts"
    rules:
      - "Owns the whole react-hook-form lifecycle: useForm, defaults, submit/reset, dirty-state sync."
      - "Reads operation state via use<Domain>Store(selector); never calls store.setState() directly."
      - "Gets the repository from use<Domain>Repository() and passes it to the use case."
    owns_tests: true
    depends_on: [use-case-builder, store-builder]
    parallel_with: []
    optional: false
    skills: []

  - agent: component-builder
    kind: driving-adapter
    role: the .tsx component
    owns: ["src/components/<domain>/<FeatureName>/<FeatureName>.tsx"]
    excludes: ["**/*.view-model.test.tsx", "**/*.stories.tsx"]
    rules:
      - "Destructure the view-model's return value and render. Nothing else."
      - "May render FormProvider, but only with methods returned by the view-model."
      - "No direct repository or use-case import."
    owns_tests: false
    depends_on: [view-model-builder]
    parallel_with: []
    optional: false
    skills: []

plan:
  depth: single
  scout_name: migration-scout     # legacy migration is the dominant task here
  impact_scout: false             # no .codegraph/
  spec: { enabled: false }

verify:
  layer_reviewer_checklist:
    - "Use case has zero React hooks, zero Apollo/GraphQL imports, zero infrastructure imports."
    - "Business validation lives in the use case, not the view-model or component."
    - "Loading/success/error transitions happen in the use case via the store."
    - "useForm, defaults, submit/reset and dirty-state sync live in the view-model, never in a .tsx."
    - "The view-model never calls store.setState() directly."
    - "The component only renders — no business logic, no UI logic, no repository or use-case import."
    - "No GraphQL type or __typename past the adapter."
  mechanical_checks:
    - description: "no Apollo or React in use cases"
      command: "grep -rnE 'from \"(@apollo/client|react)\"' src/*/features --include='*.use-case.ts'"
      scope: diff
      expect: empty
    - description: "no __typename outside Apollo adapters"
      command: "grep -rn '__typename' src --include='*.ts' --include='*.tsx' | grep -v -e '\\.apollo\\.ts' -e '\\.test\\.' -e '^src/services/'"
      scope: repo
      expect: empty
    - description: "components never touch the store setter"
      command: "grep -rn 'setState(' src/components --include='*.tsx'"
      scope: diff
      expect: empty
  arch_tests:
    # Nothing enforces boundaries today (the in-house eslint plugin has no
    # import rules). Candidate if accepted: generate, dependency-cruiser,
    # .dependency-cruiser.cjs, scoped to src/<migrated domain>/ only.
    status: none
    tool: ""
    path: ""
    rules: []

testing:
  placement: colocated
  path_formula: "src/<domain>/features/<feature>/<feature>.use-case.test.ts and src/components/<domain>/<FeatureName>/<FeatureName>.view-model.test.tsx"
  runners:
    - { name: jest, covers: [domain-builder, use-case-builder, view-model-builder] }
  doubles:
    style: hand-written-fakes
    location: "src/<domain>/features/shared/test/*.ts"
    rule: "Fake repositories and fresh store instances — no mocking framework for repositories."
    typed_as_port: true
  spy_technique: "jest.spyOn(fakeRepo, \"method\") on the hand-written fake — it calls through unless you add mockImplementation."
  red_stub: "export the function with its final signature and a body returning errAsync({ type: \"NETWORK_ERROR\", message: \"not implemented\" }) — babel-jest does not typecheck, so RED is an assertion failure"
  tested_layers: [domain-builder, use-case-builder, view-model-builder]
  naming: user-facing

skills:
  invariant: [hexagonal-architecture, tdd, separation-of-concerns, extract-til-you-drop, orchestrator]
  filled: [architecture, testing, error-handling]
  optional:
    i18n: { enabled: true, locales: [en, fr, de, es, tr], rule: "t(key, { ns }) — namespace per feature area under src/lib/locales/<lang>/" }
    component_design: { enabled: false, preview: storybook, platform: web }
    presentation_model: true
    modules: false
    spec_implement: false

emit:
  cursor_compat: false
  agent_suffix: ".agent.md"
  memory_file: ".claude/CLAUDE.md"   # root CLAUDE.md is `@AGENTS.md`, owned by next dev
  standing_authorization: false
  runner_model: ""
  hooks:
    receipt_check: false
